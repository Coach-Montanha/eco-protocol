<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background grid & glow -->
  <rect width="960" height="540" fill="#090d16" />
  <circle cx="480" cy="270" r="280" fill="url(#bgGlow)" filter="url(#glow)" />
  
  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="76" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="38" y="19" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">@eco</text>
    <text x="90" y="21" fill="#f8fafc" font-size="20" font-weight="700">PROTOCOLO DE ULTRA-EFICIÊNCIA EM IA</text>
    <text x="90" y="42" fill="#94a3b8" font-size="13">Arquitetura de Roteamento Inteligente &amp; Filtragem Cirúrgica de Tokens</text>
  </g>

  <!-- User Input Box (Top Left) -->
  <g transform="translate(60, 115)">
    <rect width="240" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" fill="#38bdf8" font-size="12" font-weight="bold">ENTRADA DO USUÁRIO / PROMPT</text>
    <text x="20" y="55" fill="#e2e8f0" font-size="14" font-weight="600">Tarefas, Código ou Pesquisas</text>
    <text x="20" y="74" fill="#64748b" font-size="11">Interceptação Automática @eco</text>
  </g>

  <!-- Arrow to Router -->
  <path d="M 300 160 L 370 160" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Central Router Box -->
  <g transform="translate(370, 115)">
    <rect width="220" height="90" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2" />
    <text x="110" y="32" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">ROTEADOR AUTÔNOMO @ECO</text>
    <text x="110" y="56" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Classificação Semântica</text>
    <text x="110" y="74" fill="#a7f3d0" font-size="11" text-anchor="middle">Local vs Nuvem Externa</text>
  </g>

  <!-- Branch Left: Canal Interno (Local) -->
  <path d="M 430 205 L 430 260 L 220 260 L 220 300" stroke="#34d399" stroke-width="2" fill="none" />
  
  <g transform="translate(60, 300)">
    <rect width="320" height="190" rx="14" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
    <rect x="16" y="16" width="130" height="24" rx="4" fill="#064e3b" />
    <text x="81" y="33" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="middle">CANAL INTERNO (LOCAL)</text>
    
    <g transform="translate(20, 56)">
      <circle cx="6" cy="12" r="4" fill="#10b981" />
      <text x="18" y="16" fill="#f1f5f9" font-size="13" font-weight="600">Flash-Lite Tier</text>
      <text x="120" y="16" fill="#34d399" font-size="11">~85% economia</text>
      <text x="18" y="30" fill="#94a3b8" font-size="11">Buscas, greps, leituras de arquivos</text>

      <circle cx="6" cy="48" r="4" fill="#38bdf8" />
      <text x="18" y="52" fill="#f1f5f9" font-size="13" font-weight="600">Flash Tier</text>
      <text x="120" y="52" fill="#38bdf8" font-size="11">~65% economia</text>
      <text x="18" y="66" fill="#94a3b8" font-size="11">Implementação, refatoração e testes</text>

      <circle cx="6" cy="84" r="4" fill="#a855f7" />
      <text x="18" y="88" fill="#f1f5f9" font-size="13" font-weight="600">Pro Tier</text>
      <text x="120" y="88" fill="#c084fc" font-size="11">Zero CoT inútil</text>
      <text x="18" y="102" fill="#94a3b8" font-size="11">Arquitetura crítica multi-arquivos</text>
    </g>
  </g>

  <!-- Branch Right: Canal Externo (Blindado) -->
  <path d="M 530 205 L 530 260 L 740 260 L 740 300" stroke="#38bdf8" stroke-width="2" fill="none" />
  
  <g transform="translate(580, 300)">
    <rect width="320" height="190" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <rect x="16" y="16" width="150" height="24" rx="4" fill="#082f49" />
    <text x="91" y="33" fill="#7dd3fc" font-size="11" font-weight="bold" text-anchor="middle">CANAL EXTERNO (BLINDADO)</text>
    
    <g transform="translate(20, 56)">
      <circle cx="6" cy="12" r="4" fill="#f59e0b" />
      <text x="18" y="16" fill="#f1f5f9" font-size="13" font-weight="600">Groq Engine (Llama 3.3 70B)</text>
      <text x="18" y="30" fill="#94a3b8" font-size="11">Digestão de URLs e textos pesados (&lt; 1s)</text>

      <circle cx="6" cy="48" r="4" fill="#38bdf8" />
      <text x="18" y="52" fill="#f1f5f9" font-size="13" font-weight="600">Gemini 2.5 Flash Fallback</text>
      <text x="18" y="66" fill="#94a3b8" font-size="11">Janelas massivas de 1M+ tokens</text>

      <circle cx="6" cy="84" r="4" fill="#10b981" />
      <text x="18" y="88" fill="#f1f5f9" font-size="13" font-weight="600">Regra RLAUR de Segurança</text>
      <text x="18" y="102" fill="#94a3b8" font-size="11">Zero envio de senhas, chaves ou dados</text>
    </g>
  </g>

  <!-- Center Middle: Omni-Trimmer & Stop-the-Line -->
  <g transform="translate(400, 280)">
    <rect width="160" height="110" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="80" y="26" fill="#a5b4fc" font-size="11" font-weight="bold" text-anchor="middle">OMNI-TRIMMER</text>
    <text x="80" y="48" fill="#e0e7ff" font-size="12" font-weight="600" text-anchor="middle">Next-Action Preservation</text>
    <text x="80" y="66" fill="#c7d2fe" font-size="10" text-anchor="middle">Logs cortados: -80%</text>
    <line x1="20" y1="76" x2="140" y2="76" stroke="#4338ca" stroke-width="1" />
    <text x="80" y="94" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Stop-the-Line (Exit 0)</text>
  </g>

  <!-- Bottom Stats Banner -->
  <g transform="translate(60, 502)">
    <text x="0" y="14" fill="#64748b" font-size="11">🚀 Redução média de 70% a 85% de tokens | Compatível com Cursor, Claude Code, Antigravity, Open WebUI e ChatGPT</text>
  </g>
</svg>
